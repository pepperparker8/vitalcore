<title>VitalCore tests</title>
<!-- v118 acceptance tests (Spec v2, Phase A), v119 chart, briefing and import tests. Open over a local server: /tests/. No library, not cached by sw.js, never writes storage or calls the network. -->
<style>
:root{--bg:#F3F4F6;--card:#FFFFFF;--text:#14171C;--t2:#5B6472;--ok:#0D7A6B;--bad:#C2361B}
@media (prefers-color-scheme:dark){:root{--bg:#121316;--card:#1C1E22;--text:#ECEDEF;--t2:#9AA2AE;--ok:#3FB8A5;--bad:#FF7A5C}}
body{margin:0;padding:16px;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,sans-serif}
h1{font-size:18px;margin:0 0 4px}
#sum{margin:0 0 12px;color:var(--t2)}
.t{background:var(--card);border-radius:12px;padding:10px 12px;margin:0 0 8px}
.t b{display:block}
.t small{color:var(--t2);display:block;word-break:break-word}
.pass b::before{content:"PASS  ";color:var(--ok)}
.fail b::before{content:"FAIL  ";color:var(--bad)}
</style>
<script>
// the app's scripts save on pagehide; the test fixtures must never reach the app's storage on this origin
try{Storage.prototype.setItem=function(){};}catch(e){}
</script>

<script>
// app.js is left out: it starts the app (init) and would load and save real data
save=function(d){_s=d;};persistSave=function(){};flushSave=function(){};queuePush=function(){};updSyncStatus=function(){};
const later=[];   // async tests (v119): each is a promise that calls check() itself
const res=[];
function check(name,ok,info){res.push({name,ok:!!ok,info});}
function run(name,fn){try{fn();}catch(e){check(name,false,'Threw: '+e.message);}}

// a steady athlete: 35 days of HRV (56/64 alternating, the last week at 64), resting HR 49/51, 7h30 asleep every night (goal 7h30), no training
function base(o={}){
  const s=JSON.parse(JSON.stringify(DEFAULTS));s.onboardingDone=true;s.readHist={};s.bodyHist={};
  s.profile.sleepGoal=7.5;
  for(let i=0;i<35;i++){
    const dt=dAgo(i);
    s.wellness[dt]={hrv:i<=6?64:(i%2?56:64),rhr:i===0?50:(i%2?49:51)};
    if(!o.noSleep||i>=2)s.sleepLogs.push({id:'sl-'+dt,date:dt,durMin:450});
  }
  s.sleepLogs.reverse();
  if(o.hrvDays!=null)Object.keys(s.wellness).forEach(dt=>{if(daysAgo(dt)>=o.hrvDays)delete s.wellness[dt].hrv;});
  const live=o.live===false?0:o.bodyDays??14;
  for(let i=1;i<=live;i++)s.bodyHist[dAgo(i)]=80;
  _s=s;return s;
}
const ci=(o={})=>({id:'ci-'+td(),date:td(),energy:3,mood:3,stress:2,motivation:3,...o});

// Test 2: one low HRV morning moves Body a little and leaves the verdict alone
run('Test 2',()=>{
  base();const a=calcBody().score,va=coachVerdict().lvl;
  _s.wellness[td()].hrv=52;const b=calcBody().score,vb=coachVerdict().lvl;
  check('Test 2: a single-morning HRV dip leaves the verdict unchanged',bodyLive()&&va===vb&&va==='ok',`Body ${a} → ${b} after HRV 64 → 52 this morning; verdict ${va} → ${vb}`);
});
// and the control: a week of low HRV does move it
run('Test 2b',()=>{
  base();for(let i=0;i<7;i++)_s.wellness[dAgo(i)].hrv=50;
  const B=calcBody(),v=coachVerdict().lvl;
  check('Test 2b (control): a week of low HRV does change the verdict',v!=='ok',`Body ${B.score}, HRV z ${B.parts.hrv.z.toFixed(1)}, verdict ${v}`);
});
// Test 10: no sleep record dated today or yesterday: sleep is missing and re-weighted; the night two days ago is not used
run('Test 10',()=>{
  base({noSleep:true});const B=calcBody(),p=B.parts;
  const expect=p.hrv&&p.rhr?Math.round((p.hrv.pts*TH.W_HRV+p.rhr.pts*TH.W_RHR)/(TH.W_HRV+TH.W_RHR)):null;
  check('Test 10: no sleep today or yesterday → sleep missing, re-weighted, no older night',p.sleep===null&&B.missing.some(m=>m.k==='sleep')&&B.score===expect&&B.conf==='low',`score ${B.score} (HRV and resting HR only: ${expect}), confidence ${B.conf}, missing: ${B.missing.map(m=>m.k).join(', ')}`);
});
// Test 11: HRV on only 6 days: under TH.MIN_BASE_DAYS, so HRV is left out and confidence is low
run('Test 11',()=>{
  base({hrvDays:6});const B=calcBody();
  check('Test 11: 6 days of HRV → HRV excluded, confidence Low',B.parts.hrv===null&&B.conf==='low'&&B.score!=null,`score ${B.score}, confidence ${B.conf}; ${(B.missing.find(m=>m.k==='hrv')||{}).why||'HRV not listed as missing'}`);
});
// Test 12: each signal sits in exactly one place of the score and verdict path (the code is read as text)
run('Test 12',()=>{
  // calcMind reads the check-in through mindOf (v120), so both are its text
  const paths={calcBody,calcLoad,calcMind:String(calcMind)+String(mindOf),illness,coachVerdict};
  const sig=[['form (TSB)',/tsb/i,['calcLoad']],['injury',/injur/i,['coachVerdict']],['check-in (energy, mood, motivation)',/\.(energy|mood|motivation)\b/,['calcMind']],['soreness',/soreness/i,[]]];
  sig.forEach(([lab,re,want])=>{
    const got=Object.keys(paths).filter(k=>re.test(String(paths[k])));
    const ok=got.join()===want.join();
    check(`Test 12: ${lab} in ${want.length?want.join():'no score or verdict'}`,ok,`found in: ${got.join(', ')||'none'}`);
  });
  check('Test 12: soreness shapes the session only (strategy)',/sore/.test(strategy.toString()),'strategy() reads it; v120 moves it into the session rules');
  check('Test 12: Body has no self-report, form or injury',!/tsb|injur|soreness|checkins|calcBurnout/i.test(calcBody.toString()),'calcBody reads HRV, resting heart rate and sleep only');
});
// Illness gate (A4)
run('Illness',()=>{
  base();_s.checkins=[ci({symptoms:2})];
  check('Illness: below the neck → systemic, verdict Rest',(illness()||{}).lvl==='systemic'&&coachVerdict().lvl==='bad',`illness ${(illness()||{}).lvl}, verdict ${coachVerdict().lvl}`);
  _s.checkins=[ci({symptoms:1})];
  check('Illness: above the neck → mild, verdict capped at Hold steady',(illness()||{}).lvl==='mild'&&coachVerdict().lvl==='warn',`illness ${(illness()||{}).lvl}, Body ${calcBody().score}, verdict ${coachVerdict().lvl}`);
  _s.checkins=[ci({symptoms:0})];
  check('Illness: no symptoms and normal nights → no gate',illness()===null&&coachVerdict().lvl==='ok',`illness ${illness()}, verdict ${coachVerdict().lvl}`);
  base();for(let i=0;i<35;i++)_s.wellness[dAgo(i)].resp=i===0?15.6:(i%2?14.0:14.4);_s.wellness[td()].rhr=55;
  check('Illness: breathing up 1+ and resting HR z ≥ 1.5 → systemic',(illness()||{}).lvl==='systemic',(illness()||{}).why||'no gate');
  _s.wellness[td()].rhr=50;
  check('Illness: breathing up alone → no gate',illness()===null,`illness ${illness()}`);
});
// Parallel run (A6): the old readiness leads until Body has 14 recorded days
run('Parallel',()=>{
  base({bodyDays:13});_s.checkins=[ci()];
  const a=bodyLive(),ha=heroScore()===calcReadiness();
  base({bodyDays:14});
  const b=bodyLive(),hb=heroScore()===calcBody().score;
  check('Parallel run: 13 Body days → old readiness, 14 → Body',!a&&ha&&b&&hb,`13 days: live ${a}; 14 days: live ${b}`);
});
// Load and Mind
run('Load',()=>{
  base();const st=t=>{_s.intervalsData.tsb=t;return calcLoad().state;};
  const r=[[8,'Fresh'],[0,'Normal'],[-25,'Tired'],[-35,'Overreached']].map(([t,w])=>[t,w,st(t)]);
  check('Load: form bands from TH',r.every(x=>x[1]===x[2]),r.map(x=>`form ${x[0]} → ${x[2]}`).join(', '));
});
run('Mind',()=>{
  base();_s.checkins=[ci({energy:4,mood:4,stress:1,motivation:4})];const a=calcMind().state;
  _s.checkins=[ci({energy:2,mood:2,stress:3,motivation:2})];const b=calcMind().state;
  _s.checkins=[ci({energy:1,mood:1,stress:4,motivation:1})];const c=calcMind().state;
  check('Mind: Good, Flat, Strained',a==='Good'&&b==='Flat'&&c==='Strained',`${a}, ${b}, ${c}`);
});
// v120 mood chart: one line (the Mind score with its zones) or one answer at a time; a tapped day lists all four
run('Mood chart',()=>{
  base();
  const lo=mindOf(ci({energy:1,mood:1,stress:4,motivation:1})),hi=mindOf(ci({energy:4,mood:4,stress:1,motivation:4}));
  check('Mood chart: the Mind score runs from 25 to 100, with calm as 5 minus stress',lo===25&&hi===100&&mindOf({energy:3})===null,`all Low ${lo}, all Great ${hi}`);
  const z=v=>(chZone({zones:mindZones()},v)||{}).label;
  const r=[[TH.MIND_GOOD,'Good'],[TH.MIND_GOOD-1,'Flat'],[TH.MIND_FLAT,'Flat'],[TH.MIND_FLAT-1,'Strained']].map(([v,w])=>[v,w,z(v)]);
  const agree=[[4,4,1,4],[3,3,2,3],[2,3,2,2],[2,2,3,2],[1,2,4,1]].every(([e,m,s,mo])=>{_s.checkins=[ci({energy:e,mood:m,stress:s,motivation:mo})];const M=calcMind();return z(M.score)===M.state;});
  check('Mood chart: zones switch at the TH cuts and agree with Mind',r.every(x=>x[1]===x[2])&&agree,r.map(x=>`${x[0]} → ${x[2]}`).join(', ')+(agree?'; Mind agrees':'; Mind disagrees'));
  const host=document.createElement('div');host.style.width='328px';host.innerHTML='<div id="moodChips"></div><div id="moodCanvas"></div><div id="moodNote"></div>';document.body.appendChild(host);
  try{
    _s.checkins=[[6,3,4,1,3],[4,2,2,3,2],[2,4,3,1,4],[0,2,1,4,2]].map(([a,m,e,s,mo])=>({id:'c'+a,date:dAgo(a),mood:m,energy:e,stress:s,motivation:mo}));
    _moodK='Mind';renderMoodChart();const A=_ch.moodCanvas.cfg,chips=[...host.querySelectorAll('#moodChips .chip')];
    check('Mood chart: All four is one Mind line with zones, and five chips',A.series.length===1&&A.series[0].name==='Mind'&&A.zones.length===3&&A.series[0].pts[3].v===mindOf(_s.checkins[3])&&chips.length===5&&chips[0].classList.contains('sel'),`${A.series.length} line (${A.series[0].name}), ${chips.length} chips: ${chips.map(c=>c.textContent).join(', ')}`);
    const x=A.extra(dAgo(0));
    check('Mood chart: a tapped day lists all four answers in words',x==='Mood Fair · Energy Low · Calm Low · Motivation Fair'&&A.extra(dAgo(1))==='',x);
    chips[3].click();const C=_ch.moodCanvas.cfg;
    check('Mood chart: a chip shows that answer on its own, Low to Great',_moodK==='Calm'&&C.series.length===1&&C.series[0].name==='Calm'&&C.series[0].pts.map(p=>p.v).join()==='4,2,4,1'&&C.min===1&&C.max===4&&host.querySelector('#moodChips .sel').textContent==='Calm',`${C.series[0].name}: ${C.series[0].pts.map(p=>p.v).join(', ')}`);
  }finally{_moodK='Mind';host.remove();}
});
// Sync: a batch keeps the same keys in every row, and the new fields stay out while empty
run('Sync',()=>{
  const rows=sameKeys([{id:'a',symptoms:1},{id:'b'}]);
  check('Sync: rows in one upload share their keys','symptoms' in rows[1]&&rows[1].symptoms===null,JSON.stringify(rows));
  const ks=Object.keys(fromRow('checkins',{id:'x',date:td(),updated_at:new Date().toISOString(),energy:3}));
  check('Sync: a cloud row without the v118 columns adds no empty fields',!ks.includes('symptoms')&&!ks.includes('bodyFeel')&&!ks.includes('soreArea'),ks.join(', '));
});

// v119 chart engine: zone words at the TH edges, window stats, Monday-start weeks
run('Chart zones',()=>{
  const z=v=>(chZone({zones:formZones()},v)||{}).label;
  const r=[[TH.FORM_FRESH,'Fresh'],[TH.FORM_FRESH-0.1,'Balanced'],[TH.FORM_OK,'Balanced'],[TH.FORM_OK-0.1,'Tired'],[TH.FORM_TIRED,'Tired'],[TH.FORM_TIRED-0.1,'Very tired'],[TH.FORM_DEEP,'Very tired'],[TH.FORM_DEEP-0.1,'Overreached']].map(([v,w])=>[v,w,z(v)]);
  check('Chart: form zones switch exactly at the TH cuts',r.every(x=>x[1]===x[2]),r.map(x=>`${x[0]} → ${x[2]}`).join(', '));
  base();const st=t=>{_s.intervalsData.tsb=t;return calcLoad().state;};
  const same=[[TH.FORM_FRESH,'Fresh'],[TH.FORM_DEEP-0.1,'Overreached']].every(([v,w])=>st(v)===w&&z(v)===w);
  check('Chart: the chart and Load agree at the ends',same,`Fresh at ${TH.FORM_FRESH}, Overreached under ${TH.FORM_DEEP}`);
});
run('Chart stats',()=>{
  const pts=[];for(let i=9;i>=0;i--)pts.push({d:dAgo(i),v:10-i});   // 1 … 10, today = 10
  const a=DN(dAgo(4)),b=DN(td()),s=chStatsOf(pts,a,b,v=>v>=8);
  check('Chart: stats cover only the days in view',s.n===5&&s.avg===8&&s.hi.v===10&&s.lo.v===6&&s.good===3&&s.first.d===dAgo(4)&&s.last.d===td(),`n ${s.n}, average ${s.avg}, high ${s.hi.v}, low ${s.lo.v}, ${s.good} of ${s.n} at 8 or more`);
  const e=chStatsOf(pts,DN(dAgo(40)),DN(dAgo(30)));
  check('Chart: an empty window gives no numbers',e.n===0&&e.good===null,JSON.stringify(e));
});
run('Week buckets',()=>{
  // 1 Jan 2024 was a Monday
  const w=weekBuckets([{d:'2023-12-31',v:1},{d:'2024-01-01',v:2},{d:'2024-01-07',v:3},{d:'2024-01-08',v:null}]);
  check('Chart: weeks start on Monday, so a Sunday belongs to the week before',w.length===2&&w[0].d==='2023-12-25'&&w[0].v===1&&w[1].d==='2024-01-01'&&w[1].v===5&&w[1].n===2,JSON.stringify(w));
  const m=weekBuckets([{d:'2024-01-01',v:2},{d:'2024-01-03',v:4}],'avg');
  check('Chart: weekly average',m.length===1&&m[0].v===3,JSON.stringify(m));
});

// v119 streaming: server-sent events split anywhere, and the briefing read while it is still arriving
run('Stream events',()=>{
  const full='event: message_start\ndata: {"type":"message_start","message":{"usage":{"input_tokens":5}}}\n\nevent: ping\ndata: {"type":"ping"}\n\r\nevent: content_block_delta\ndata: {"type":"content_block_delta","delta":{"type":"text_delta","text":"Hel"}}\n\nevent: content_block_delta\ndata: {"type":"content_block_delta","delta":{"type":"text_delta","text":"lo"}}\n\nevent: message_delta\ndata: {"type":"message_delta","delta":{"stop_reason":"end_turn"},"usage":{"output_tokens":2}}\n\n';
  let buf='',ev=[];for(let i=0;i<full.length;i+=7){const r=sseEvents(buf+full.slice(i,i+7));buf=r.rest;ev.push(...r.events);}
  const txt=ev.filter(e=>e.event==='content_block_delta').map(e=>JSON.parse(e.data).delta.text).join('');
  const stop=JSON.parse(ev.find(e=>e.event==='message_delta').data).delta.stop_reason;
  check('Stream: events split across 7-character chunks come out whole',ev.length===5&&txt==='Hello'&&stop==='end_turn'&&buf==='',`${ev.length} events (${ev.map(e=>e.event).join(', ')}), text "${txt}", stop ${stop}`);
});
run('Stream partial',()=>{
  const a=insPartial('{"archetype":"Steady builder","overall":"You slept \\"well\\" and","day":"Rec');
  check('Stream: closed and open fields, escaped quotes',a.o.archetype==='Steady builder'&&a.o.overall==='You slept "well" and'&&a.o.day==='Rec'&&a.live==='day',JSON.stringify(a));
  const b=insPartial('{"overall":"Line one\\nline two \\u00e9 and \\u00');
  check('Stream: a half-arrived escape is held back',b.o.overall==='Line one\nline two é and '&&b.live==='overall',JSON.stringify(b));
  const c=insPartial('{"overall":"Done.","questions":["Why?"]}');
  check('Stream: a finished reply has nothing live',c.o.overall==='Done.'&&c.live===null,JSON.stringify(c));
  const h=insLive('{"archetype":"Steady builder","overall":"Short <b>version</b>","day":"Today');
  check('Stream: the live view escapes text and marks the section being written',/Short &lt;b&gt;version/.test(h)&&(h.match(/ins-caret/g)||[]).length===1&&/Today<span class="ins-caret">/.test(h),h.replace(/<svg[\s\S]*?<\/svg>/g,'').slice(0,240));
});
// a canned stream through askClaudeStream, with fetch replaced (no network)
const sseResp=(chunks,status=200)=>new Response(new ReadableStream({start(c){const e=new TextEncoder();chunks.forEach(x=>c.enqueue(e.encode(x)));c.close();}}),{status,headers:{'Content-Type':'text/event-stream'}});
const realFetch=window.fetch;
later.push((async()=>{
  try{
    const ev=(t,o)=>`event: ${t}\ndata: ${JSON.stringify({type:t,...o})}\n\n`;
    const body=ev('message_start',{message:{usage:{input_tokens:9}}})+ev('content_block_start',{index:0,content_block:{type:'thinking',thinking:''}})+ev('content_block_delta',{delta:{type:'thinking_delta',thinking:'hmm'}})+ev('content_block_delta',{delta:{type:'text_delta',text:'{"overall":"Fine'}})+ev('content_block_delta',{delta:{type:'text_delta',text:'."}'}})+ev('message_delta',{delta:{stop_reason:'end_turn'},usage:{output_tokens:4}})+ev('message_stop',{});
    let sent=null;window.fetch=async(u,o)=>{sent=JSON.parse(o.body);return sseResp([body.slice(0,50),body.slice(50,51),body.slice(51)]);};
    const seen=[];const r=await askClaudeStream('k',{model:'m',max_tokens:10,messages:[]},t=>seen.push(t));
    check('Stream: askClaudeStream collects text only, with the stop reason',r.ok&&r.data.content[0].text==='{"overall":"Fine."}'&&r.data.stop_reason==='end_turn'&&sent.stream===true&&seen[seen.length-1]==='{"overall":"Fine."}',`text ${r.data.content[0].text}, stop ${r.data.stop_reason}, ${seen.length} updates, usage ${JSON.stringify(r.data.usage)}`);
    window.fetch=async()=>sseResp([ev('content_block_delta',{delta:{type:'text_delta',text:'x'}})+'event: error\ndata: {"type":"error","error":{"type":"overloaded_error","message":"Overloaded"}}\n\n']);
    const e=await askClaudeStream('k',{},null);
    check('Stream: an error event mid-stream is a failure (overloaded = 529)',!e.ok&&e.status===529&&/529/.test(insApiError(e)),`${e.status}: ${insApiError(e)}`);
    window.fetch=async()=>new Response(JSON.stringify({error:{type:'authentication_error',message:'invalid x-api-key'}}),{status:401});
    const f=await askClaudeStream('k',{},null);
    check('Stream: a refused request returns its error body',!f.ok&&f.status===401&&f.data.error.type==='authentication_error',`${f.status}: ${insApiError(f)}`);
    // genInsight: low effort, streamed, cached instructions; an effort the API rejects is dropped and the schema kept
    base();_s.claudeKey='test';_s.checkins=[ci()];const calls=[];
    window.fetch=async(u,o)=>{const b=JSON.parse(o.body);calls.push(b);return calls.length===1?new Response(JSON.stringify({error:{type:'invalid_request_error',message:'output_config.effort: Extra inputs are not permitted'}}),{status:400}):new Response(JSON.stringify({error:{type:'authentication_error',message:'invalid x-api-key'}}),{status:401});};
    await genInsight(true);
    const[a,b]=calls,oc=a&&a.output_config||{},oc2=b&&b.output_config||{};
    check('Briefing: the request is low effort, streamed, with the instructions cached',calls.length===2&&a.stream===true&&oc.effort==='low'&&oc.format&&oc.format.type==='json_schema'&&a.max_tokens===8000&&a.system[0].cache_control&&a.system[0].cache_control.type==='ephemeral'&&a.model===CLAUDE_MODEL,`calls ${calls.length}; effort ${oc.effort}, schema ${!!oc.format}, max ${a&&a.max_tokens}, cached ${!!(a&&a.system[0].cache_control)}`);
    check('Briefing: a rejected effort setting is dropped, the schema kept, and the error shown with the quick summary',b&&!('effort' in oc2)&&oc2.format&&/did not load/.test($('insContent').innerHTML)&&/Quick summary/.test($('insContent').innerHTML),`second call: ${JSON.stringify(Object.keys(oc2))}`);
  }catch(e){check('Stream: async tests',false,'Threw: '+e.message);}
  finally{window.fetch=realFetch;}
})());

// v119 briefing data: trimmed, no duplicate check-in or night, no app or device names
run('Briefing data',()=>{
  base();const s=_s;s.profile.age=40;s.profile.height=175;s.intervalsData={ctl:55,atl:60,tsb:-5,prs:[]};
  const long='Felt fine after a steady week of training and work, slept a bit late on some nights and ate well most days. '.repeat(4);
  for(let i=0;i<30;i++){const dt=dAgo(i);
    s.checkins.push({id:'ci-'+dt,date:dt,energy:3,mood:3,stress:2,motivation:3,soreness:2,coffee:2,mindfulMin:10,gratitude:'Family and a good run',reflection:long.slice(0,300),bodyFeel:4});
    s.workouts.push({id:'w'+i,date:dt,type:i%2?'Run':'Cycle',durMin:60,distKm:10,rpe:3,notes:'Easy aerobic, felt smooth',sub:{icu:{hr:140,hrMax:160,kcal:600,elev:100,load:60}}});
    s.measurements.push({id:'mi-'+dt,date:dt,weight:70+i/10,hr:null,bpSys:null,bpDia:null});
  }
  s.checkins.reverse();
  for(let i=0;i<6;i++)s.bloodLogs.push({id:'b'+i,date:dAgo(i*30),glucose:90+i,chol:180+i,uric:5+i/10,hdl:50,ldl:110});
  s.polarNights=[];for(let i=0;i<14;i++){const dt=dAgo(i);
